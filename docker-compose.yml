# Local / dev: PostgreSQL + webhook app (port 6005)
services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      POSTGRES_DB: ${POSTGRES_DB:-webhook_viewer}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - webhook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  webhook-app:
    container_name: webhook-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-6005}:6005"
    environment:
      NODE_ENV: production
      PORT: 6005
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-webhook}:${POSTGRES_PASSWORD:-webhook}@postgres:5432/${POSTGRES_DB:-webhook_viewer}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webhook-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # React-фронтенд, собранный статикой и отданный nginx; он же проксирует
  # /auth, /admin, /room, /hook, /health на webhook-app — единая точка входа
  # снаружи (см. docs/RFC-roadmap.md, раздел 5).
  nginx:
    container_name: webhook-nginx
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      webhook-app:
        condition: service_healthy
    networks:
      - webhook-network

volumes:
  pg_data:

networks:
  webhook-network:
    driver: bridge
