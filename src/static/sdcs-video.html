<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SDCS Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet" />
  <style>
    * { user-select: none; }
    body { background: #020617; overflow: hidden; }
    .player-gradient {
      background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.35), transparent);
    }
    .glass {
      backdrop-filter: blur(16px);
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255,255,255,.08);
    }
    input[type="range"] {
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      overflow: hidden;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: white;
      box-shadow: -1000px 0 0 1000px white;
      cursor: pointer;
    }
    .controls-hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
    .video-shadow {
      box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 20px 60px rgba(0,0,0,.55);
    }
    .loader {
      width: 70px; height: 70px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #youtube-player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-8">

    <div id="playerContainer" class="relative w-full max-w-7xl rounded-3xl overflow-hidden video-shadow bg-black">

    <div id="youtube-player" class="w-full aspect-video bg-black"></div>

    <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black z-30">
      <div class="loader"></div>
    </div>

    <button id="centerPlay" type="button" class="absolute inset-0 z-20 flex items-center justify-center">
      <div class="glass rounded-full w-28 h-28 flex items-center justify-center text-white text-6xl transition hover:scale-110">
        <i class="ri-play-fill ml-2"></i>
      </div>
    </button>

    <div id="topBar" class="absolute top-0 left-0 right-0 z-20 p-6 transition-all duration-300">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-white text-2xl font-bold tracking-tight">SDCS Cinema</h1>
          <p class="text-zinc-400 text-sm mt-1">YouTube</p>
        </div>
        <a
          href="https://www.youtube.com/watch?v=__SDCS_YOUTUBE_VIDEO_ID__"
          target="_blank"
          rel="noopener noreferrer"
          class="glass px-4 py-2 rounded-2xl text-white text-sm flex items-center gap-2 hover:bg-white/10 transition"
        >
          <i class="ri-youtube-fill text-red-400"></i>
          РћС‚РєСЂС‹С‚СЊ РЅР° YouTube
        </a>
      </div>
    </div>

    <div id="controls" class="player-gradient absolute bottom-0 left-0 right-0 z-20 p-6 transition-all duration-300">
      <div class="mb-5">
        <input id="progress" type="range" min="0" max="100" value="0" class="w-full cursor-pointer" />
      </div>
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-5">
          <button id="playPause" type="button" class="text-white text-3xl hover:scale-110 transition">
            <i class="ri-play-fill"></i>
          </button>
          <div class="flex items-center gap-3">
            <button id="muteBtn" type="button" class="text-white text-2xl">
              <i class="ri-volume-up-fill"></i>
            </button>
            <input id="volume" type="range" min="0" max="100" value="100" class="w-28" />
          </div>
          <div class="text-zinc-300 text-sm font-medium tracking-wide">
            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
          </div>
        </div>
        <div class="flex items-center gap-5">
          <select id="speed" class="glass text-white px-3 py-2 rounded-xl outline-none">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button id="fullscreen" type="button" class="text-white text-2xl">
            <i class="ri-fullscreen-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SDCS_YOUTUBE_VIDEO_ID = "__SDCS_YOUTUBE_VIDEO_ID__";

    const controls = document.getElementById("controls");
    const topBar = document.getElementById("topBar");
    const playPause = document.getElementById("playPause");
    const centerPlay = document.getElementById("centerPlay");
    const progress = document.getElementById("progress");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volume = document.getElementById("volume");
    const muteBtn = document.getElementById("muteBtn");
    const fullscreen = document.getElementById("fullscreen");
    const loading = document.getElementById("loading");
    const speed = document.getElementById("speed");
    const container = document.getElementById("playerContainer");

    let player = null;
    let hideControlsTimeout;
    let progressTimer = null;

    function formatTime(time) {
      if (!time || !Number.isFinite(time)) return "0:00";
      const mins = Math.floor(time / 60);
      const secs = Math.floor(time % 60);
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function updatePlayState() {
      if (!player || typeof player.getPlayerState !== "function") return;
      const state = player.getPlayerState();
      const paused = state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING;
      playPause.innerHTML = paused ? '<i class="ri-play-fill"></i>' : '<i class="ri-pause-fill"></i>';
      centerPlay.style.display = paused ? "flex" : "none";
    }

    function togglePlay() {
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function showControls() {
      controls.classList.remove("controls-hidden");
      topBar.classList.remove("controls-hidden");
      clearTimeout(hideControlsTimeout);
      if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
        hideControlsTimeout = setTimeout(() => {
          controls.classList.add("controls-hidden");
          topBar.classList.add("controls-hidden");
        }, 2500);
      }
    }

    function syncProgress() {
      if (!player || typeof player.getCurrentTime !== "function") return;
      const d = player.getDuration();
      const t = player.getCurrentTime();
      if (!Number.isFinite(d) || d <= 0) return;
      progress.value = String((t / d) * 100);
      currentTimeEl.textContent = formatTime(t);
      durationEl.textContent = formatTime(d);
    }

    function startProgressLoop() {
      if (progressTimer) return;
      progressTimer = setInterval(syncProgress, 250);
    }

    function stopProgressLoop() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function onPlayerReady() {
      loading.style.display = "none";
      durationEl.textContent = formatTime(player.getDuration());
      volume.value = String(player.isMuted() ? 0 : player.getVolume());
      updatePlayState();
      startProgressLoop();
    }

    function onPlayerStateChange(event) {
      updatePlayState();
      if (event.data === YT.PlayerState.BUFFERING) {
        loading.style.display = "flex";
        loading.innerHTML = '<div class="loader"></div>';
      } else {
        loading.style.display = "none";
      }
      if (event.data === YT.PlayerState.PLAYING) {
        startProgressLoop();
      }
      if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        syncProgress();
      }
    }

    function onPlayerError() {
      loading.innerHTML =
        '<p class="text-red-400 text-center px-6">Не удалось загрузить видео с YouTube. Проверьте SDCS_YOUTUBE_URL или доступность ролика.</p>';
      loading.style.display = "flex";
    }

    function initYoutubePlayer() {
      player = new YT.Player("youtube-player", {
        videoId: SDCS_YOUTUBE_VIDEO_ID,
        playerVars: {
          autoplay: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          origin: window.location.origin,
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    window.onYouTubeIframeAPIReady = initYoutubePlayer;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    playPause.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
    centerPlay.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });

    progress.addEventListener("input", () => {
      if (!player) return;
      const d = player.getDuration();
      if (!Number.isFinite(d) || d <= 0) return;
      player.seekTo((Number(progress.value) / 100) * d, true);
    });

    volume.addEventListener("input", () => {
      if (!player) return;
      const v = Number(volume.value);
      player.setVolume(v);
      if (v > 0 && player.isMuted()) player.unMute();
      muteBtn.innerHTML = v === 0 || player.isMuted()
        ? '<i class="ri-volume-mute-fill"></i>'
        : '<i class="ri-volume-up-fill"></i>';
    });

    muteBtn.addEventListener("click", () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        if (Number(volume.value) === 0) {
          volume.value = "100";
          player.setVolume(100);
        }
      } else {
        player.mute();
      }
      muteBtn.innerHTML = player.isMuted()
        ? '<i class="ri-volume-mute-fill"></i>'
        : '<i class="ri-volume-up-fill"></i>';
    });

    speed.addEventListener("change", () => {
      if (player) player.setPlaybackRate(Number(speed.value));
    });

    fullscreen.addEventListener("click", async () => {
      if (!document.fullscreenElement) {
        await container.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    });

    container.addEventListener("mousemove", showControls);
    window.addEventListener("beforeunload", stopProgressLoop);
    showControls();
  </script>
</body>
</html>
