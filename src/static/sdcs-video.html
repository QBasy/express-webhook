<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SDCS Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.5rem, 2vw, 2rem);
      user-select: none;
    }

    .player-shell {
      position: relative;
      width: min(100%, 80rem);
      max-height: calc(100dvh - 1rem);
      border-radius: clamp(0.75rem, 2vw, 1.5rem);
      overflow: hidden;
      background: #000;
    }

    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100dvh - 2rem);
      background: #000;
      overflow: hidden;
    }

    .yt-crop {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    #youtube-player {
      position: absolute;
      inset: 0;
    }

    #youtube-player iframe {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      transform: translate(-50%, -50%) scale(1.26) !important;
      transform-origin: center center;
      pointer-events: none !important;
      filter: none !important;
      opacity: 1 !important;
    }

    /* Только узкие полоски UI — центр видео без затемнения */
    .ui-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 0.75rem 1rem;
      background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 65%, transparent 100%);
      pointer-events: none;
    }
    .ui-top > * { pointer-events: auto; }

    .ui-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 0.75rem 1rem 1rem;
      background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      pointer-events: none;
    }
    .ui-bottom > * { pointer-events: auto; }

    .ui-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none !important;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .ui-top, .ui-bottom {
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .ui-chip {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      pointer-events: none;
    }
    #loading.is-hidden {
      display: none;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #centerPlay {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 25;
      transform: translate(-50%, -50%);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    #centerPlay.is-hidden {
      display: none;
    }
    .play-disc {
      width: 5rem;
      height: 5rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid #fff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    @media (min-width: 640px) {
      .play-disc { width: 6.5rem; height: 6.5rem; font-size: 3.25rem; }
    }

    input[type="range"] {
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.35);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
    }

    .player-shell:fullscreen,
    .player-shell:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      border-radius: 0;
    }
    .player-shell:fullscreen .video-stage,
    .player-shell:-webkit-full-screen .video-stage {
      width: 100%;
      height: 100%;
      max-height: none;
      aspect-ratio: auto;
    }
    .player-shell:fullscreen .yt-crop,
    .player-shell:-webkit-full-screen .yt-crop {
      inset: 0;
    }
    .player-shell:fullscreen #youtube-player iframe,
    .player-shell:-webkit-full-screen #youtube-player iframe {
      transform: translate(-50%, -50%) scale(1.22) !important;
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .player-shell { width: 100%; border-radius: 0; }
      .yt-link .label { display: none; }
    }
  </style>
</head>
<body>

  <div id="playerContainer" class="player-shell">
    <div id="videoStage" class="video-stage">

      <div class="yt-crop">
        <div id="youtube-player"></div>
      </div>

      <div id="loading">
        <div class="loader"></div>
      </div>

      <button id="centerPlay" type="button" aria-label="Play">
        <span class="play-disc"><i class="ri-play-fill ml-0.5"></i></span>
      </button>

      <header id="topBar" class="ui-top">
        <div class="flex items-center justify-between gap-3">
          <h1 class="text-white text-base sm:text-lg font-bold truncate m-0">SDCS Cinema</h1>
          <a
            href="https://www.youtube.com/watch?v=__SDCS_YOUTUBE_VIDEO_ID__"
            target="_blank"
            rel="noopener noreferrer"
            class="yt-link ui-chip shrink-0 px-2.5 py-1.5 rounded-lg text-white text-xs sm:text-sm inline-flex items-center gap-1.5"
          >
            <i class="ri-youtube-fill text-red-500"></i>
            <span class="label">YouTube</span>
          </a>
        </div>
      </header>

      <footer id="controls" class="ui-bottom">
        <input id="progress" type="range" min="0" max="100" value="0" class="w-full cursor-pointer mb-2.5" />
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-3 min-w-0">
            <button id="playPause" type="button" class="text-white text-2xl leading-none" aria-label="Play/Pause">
              <i class="ri-play-fill"></i>
            </button>
            <button id="muteBtn" type="button" class="text-white text-xl leading-none" aria-label="Mute">
              <i class="ri-volume-up-fill"></i>
            </button>
            <input id="volume" type="range" min="0" max="100" value="100" class="w-14 sm:w-20" />
            <span class="text-white text-xs tabular-nums whitespace-nowrap">
              <span id="currentTime">0:00</span>/<span id="duration">0:00</span>
            </span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <select id="speed" class="ui-chip text-white text-sm px-2 py-1 rounded-lg border-0 outline-none">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
            <button id="fullscreen" type="button" class="text-white text-xl leading-none" aria-label="Fullscreen">
              <i class="ri-fullscreen-fill" id="fsIcon"></i>
            </button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const SDCS_YOUTUBE_VIDEO_ID = "__SDCS_YOUTUBE_VIDEO_ID__";

    const controls = document.getElementById("controls");
    const topBar = document.getElementById("topBar");
    const playPause = document.getElementById("playPause");
    const centerPlay = document.getElementById("centerPlay");
    const progress = document.getElementById("progress");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volume = document.getElementById("volume");
    const muteBtn = document.getElementById("muteBtn");
    const fullscreenBtn = document.getElementById("fullscreen");
    const fsIcon = document.getElementById("fsIcon");
    const loading = document.getElementById("loading");
    const speed = document.getElementById("speed");
    const container = document.getElementById("playerContainer");
    const videoStage = document.getElementById("videoStage");

    let player = null;
    let hideControlsTimeout;
    let progressTimer = null;

    function formatTime(time) {
      if (!time || !Number.isFinite(time)) return "0:00";
      const mins = Math.floor(time / 60);
      const secs = Math.floor(time % 60);
      return mins + ":" + String(secs).padStart(2, "0");
    }

    function setChromeVisible(visible) {
      const m = visible ? "remove" : "add";
      controls.classList[m]("ui-hidden");
      topBar.classList[m]("ui-hidden");
    }

    function updatePlayState() {
      if (!player || typeof player.getPlayerState !== "function") return;
      const state = player.getPlayerState();
      const paused = state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING;
      playPause.innerHTML = paused ? '<i class="ri-play-fill"></i>' : '<i class="ri-pause-fill"></i>';
      centerPlay.classList.toggle("is-hidden", !paused);
    }

    function togglePlay() {
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function showChrome() {
      setChromeVisible(true);
      clearTimeout(hideControlsTimeout);
      if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
        hideControlsTimeout = setTimeout(() => setChromeVisible(false), 3000);
      }
    }

    function syncProgress() {
      if (!player) return;
      const d = player.getDuration();
      const t = player.getCurrentTime();
      if (!Number.isFinite(d) || d <= 0) return;
      progress.value = String((t / d) * 100);
      currentTimeEl.textContent = formatTime(t);
      durationEl.textContent = formatTime(d);
    }

    function startProgressLoop() {
      if (progressTimer) return;
      progressTimer = setInterval(syncProgress, 250);
    }

    function stopProgressLoop() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function applyIframeCrop() {
      const iframe = player?.getIframe?.();
      if (!iframe) return;
      iframe.style.pointerEvents = "none";
    }

    function onPlayerReady() {
      loading.classList.add("is-hidden");
      applyIframeCrop();
      durationEl.textContent = formatTime(player.getDuration());
      volume.value = String(player.isMuted() ? 0 : player.getVolume());
      updatePlayState();
      startProgressLoop();
      window.addEventListener("resize", applyIframeCrop);
    }

    function onPlayerStateChange(event) {
      updatePlayState();
      if (event.data === YT.PlayerState.BUFFERING) {
        loading.classList.remove("is-hidden");
      } else {
        loading.classList.add("is-hidden");
      }
      if (event.data === YT.PlayerState.PLAYING) {
        startProgressLoop();
        setChromeVisible(false);
      }
      if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        syncProgress();
        setChromeVisible(true);
      }
    }

    function onPlayerError() {
      loading.innerHTML = '<p class="text-red-400 text-sm px-4 text-center">Не удалось загрузить видео.</p>';
      loading.classList.remove("is-hidden");
    }

    function initYoutubePlayer() {
      player = new YT.Player("youtube-player", {
        videoId: SDCS_YOUTUBE_VIDEO_ID,
        host: "https://www.youtube-nocookie.com",
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          iv_load_policy: 3,
          cc_load_policy: 0,
          autohide: 1,
          origin: window.location.origin,
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    window.onYouTubeIframeAPIReady = initYoutubePlayer;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    playPause.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
    centerPlay.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });

    progress.addEventListener("input", () => {
      const d = player?.getDuration?.();
      if (!player || !Number.isFinite(d) || d <= 0) return;
      player.seekTo((Number(progress.value) / 100) * d, true);
    });

    volume.addEventListener("input", () => {
      if (!player) return;
      const v = Number(volume.value);
      player.setVolume(v);
      if (v > 0 && player.isMuted()) player.unMute();
      muteBtn.innerHTML = v === 0 || player.isMuted()
        ? '<i class="ri-volume-mute-fill"></i>'
        : '<i class="ri-volume-up-fill"></i>';
    });

    muteBtn.addEventListener("click", () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        if (Number(volume.value) === 0) { volume.value = "100"; player.setVolume(100); }
      } else {
        player.mute();
      }
      muteBtn.innerHTML = player.isMuted()
        ? '<i class="ri-volume-mute-fill"></i>'
        : '<i class="ri-volume-up-fill"></i>';
    });

    speed.addEventListener("change", () => {
      if (player) player.setPlaybackRate(Number(speed.value));
    });

    fullscreenBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) await container.requestFullscreen();
      else await document.exitFullscreen();
    });

    document.addEventListener("fullscreenchange", () => {
      fsIcon.className = document.fullscreenElement
        ? "ri-fullscreen-exit-fill"
        : "ri-fullscreen-fill";
      applyIframeCrop();
    });

    videoStage.addEventListener("mousemove", showChrome);
    videoStage.addEventListener("click", (e) => {
      if (e.target.closest("a, button, input, select, footer, header")) return;
      togglePlay();
    });

    window.addEventListener("beforeunload", stopProgressLoop);
    setChromeVisible(true);
  </script>
</body>
</html>
