server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API — проксируем на backend. Порядок важен: префиксы с trailing slash
    # идут раньше общего location /, чтобы не перехватываться SPA-фолбэком.
    location ^~ /auth/ {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /room {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /hook {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;

        # /hook/:id/stream — SSE, держим соединение открытым и не буферизуем,
        # иначе новые события копятся в буфере nginx вместо мгновенной отдачи.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # POST /integration/rooms/:id — создание комнат без логина, доступ гейтится
    # самим бэкендом (INTEGRATION_API_KEY / INTEGRATION_TRUSTED_HOSTS), см.
    # src/auth/integrationAuth.ts.
    location ^~ /integration {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://webhook-app:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: всё остальное — статика фронтенда, неизвестные пути отдают index.html
    # (React Router сам решает, что рисовать, включая 404).
    location / {
        try_files $uri /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
